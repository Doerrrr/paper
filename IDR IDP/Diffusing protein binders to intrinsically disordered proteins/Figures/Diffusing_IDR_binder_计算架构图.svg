<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="rfFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ECF8F1"/>
      <stop offset="1" stop-color="#F8FCFA"/>
    </linearGradient>
    <linearGradient id="headFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#007A3D"/>
      <stop offset="1" stop-color="#15935A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17382A" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#456257"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#007A3D"/>
    </marker>
    <style>
      .cn { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #153A2A; }
      .subtitle { font-size: 17px; fill: #567066; }
      .stage { font-size: 14px; font-weight: 700; letter-spacing: 1.2px; fill: #007A3D; }
      .cardTitle { font-size: 22px; font-weight: 700; fill: #17382A; }
      .body { font-size: 16px; fill: #29473B; }
      .small { font-size: 14px; fill: #526A61; }
      .micro { font-size: 12.5px; fill: #60746C; }
      .white { fill: #FFFFFF; }
      .bold { font-weight: 700; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#F5F8F6"/>
  <rect x="0" y="0" width="1600" height="10" fill="url(#headFill)"/>

  <g class="cn">
    <text x="60" y="66" class="title">Diffusing protein binders to intrinsically disordered proteins</text>
    <text x="60" y="98" class="subtitle">论文级计算架构：从 IDR 靶序列到稳定 binder，并在结合态中共同塑造 target 构象</text>
    <g transform="translate(1372,42)">
      <rect width="168" height="40" rx="20" fill="#E5F3EA" stroke="#7BB998"/>
      <text x="84" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#007A3D">Nature · 2025</text>
    </g>

    <!-- stage headers -->
    <text x="62" y="156" class="stage">01  DEFINE TARGET</text>
    <text x="332" y="156" class="stage">02  GENERATE COMPLEX BACKBONE</text>
    <text x="775" y="156" class="stage">03  DESIGN SEQUENCE</text>
    <text x="1026" y="156" class="stage">04  COMPUTATIONAL FILTER</text>
    <text x="1326" y="156" class="stage">05  VALIDATE</text>

    <!-- Card 1 -->
    <g filter="url(#shadow)">
      <rect x="60" y="178" width="235" height="412" rx="18" fill="#FFFFFF"/>
    </g>
    <circle cx="95" cy="218" r="18" fill="#DCEEF8"/>
    <path d="M84 219 C90 204,99 233,108 215" fill="none" stroke="#2E6FA3" stroke-width="4" stroke-linecap="round"/>
    <text x="125" y="225" class="cardTitle">靶标定义</text>

    <rect x="82" y="262" width="191" height="72" rx="12" fill="#EEF5FA" stroke="#AACADF"/>
    <text x="98" y="287" class="body bold">必需输入</text>
    <text x="98" y="314" class="body">IDP / IDR 靶片段序列</text>

    <rect x="82" y="352" width="191" height="106" rx="12" fill="#FFF8E9" stroke="#E7C87B"/>
    <text x="98" y="377" class="body bold">可选条件</text>
    <text x="98" y="403" class="body">二级结构类型</text>
    <text x="98" y="428" class="small">helix / β-strand / loop</text>
    <text x="98" y="449" class="micro">只限定类型，不固定 3D 坐标</text>

    <rect x="82" y="476" width="191" height="86" rx="12" fill="#F2F5F3" stroke="#C8D2CD"/>
    <text x="98" y="502" class="body bold">设计条件</text>
    <text x="98" y="528" class="small">binder 长度 / 链布局</text>
    <text x="98" y="551" class="small">生成数量与随机种子</text>

    <!-- Arrow 1 -->
    <path d="M300 384 L325 384" stroke="#456257" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Card 2 RFdiffusion -->
    <g filter="url(#shadow)">
      <rect x="335" y="178" width="400" height="412" rx="18" fill="url(#rfFill)" stroke="#F0B84C" stroke-width="2.5"/>
    </g>
    <rect x="355" y="193" width="122" height="28" rx="14" fill="#F4B43C"/>
    <text x="416" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#4D3810">本文关键改造</text>
    <text x="355" y="253" class="cardTitle">Flexible-target RFdiffusion</text>
    <text x="355" y="278" class="small">target 与 binder 进入同一反向扩散过程</text>

    <!-- two RF inputs -->
    <rect x="360" y="307" width="150" height="78" rx="12" fill="#E8F2F9" stroke="#9BC1D9"/>
    <text x="435" y="334" text-anchor="middle" class="body bold">条件信息</text>
    <text x="435" y="359" text-anchor="middle" class="small">target 序列</text>
    <text x="435" y="378" text-anchor="middle" class="micro">+ 可选二级结构</text>

    <rect x="560" y="307" width="150" height="78" rx="12" fill="#F2EEFA" stroke="#B9A5D7"/>
    <text x="635" y="334" text-anchor="middle" class="body bold">几何起点</text>
    <text x="635" y="359" text-anchor="middle" class="small">随机带噪坐标</text>
    <text x="635" y="378" text-anchor="middle" class="micro">target + binder</text>

    <path d="M435 390 L485 421" stroke="#2E6FA3" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M635 390 L585 421" stroke="#7655A5" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="425" y="421" width="220" height="72" rx="36" fill="#007A3D"/>
    <text x="535" y="451" text-anchor="middle" font-size="18" font-weight="700" class="white">迭代反向扩散 × T</text>
    <text x="535" y="475" text-anchor="middle" font-size="14" fill="#D8F3E4">共同恢复兼容的三维几何</text>

    <path d="M535 496 L535 521" stroke="#007A3D" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <rect x="365" y="525" width="340" height="48" rx="12" fill="#DDF2E6" stroke="#70B98F"/>
    <text x="535" y="555" text-anchor="middle" class="body bold">输出：target 结合态构象 + binder 主链</text>

    <!-- Arrow 2 -->
    <path d="M740 384 L765 384" stroke="#456257" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Card 3 ProteinMPNN -->
    <g filter="url(#shadow)">
      <rect x="775" y="178" width="215" height="412" rx="18" fill="#FFFFFF"/>
    </g>
    <circle cx="812" cy="218" r="18" fill="#E5F3EA"/>
    <text x="812" y="224" text-anchor="middle" font-size="18" font-weight="700" fill="#007A3D">A</text>
    <text x="839" y="225" font-size="19" font-weight="700" fill="#17382A">ProteinMPNN</text>

    <text x="797" y="276" class="body bold">逆折叠设计</text>
    <rect x="797" y="297" width="171" height="68" rx="12" fill="#EEF5FA" stroke="#AACADF"/>
    <text x="882" y="323" text-anchor="middle" class="small">固定生成的主链几何</text>
    <text x="882" y="347" text-anchor="middle" class="small">target 序列保持不变</text>
    <path d="M882 370 L882 397" stroke="#456257" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="797" y="402" width="171" height="82" rx="12" fill="#E8F6EE" stroke="#83BFA0"/>
    <text x="882" y="431" text-anchor="middle" class="body bold">设计 binder 序列</text>
    <text x="882" y="457" text-anchor="middle" class="small">一个骨架可采样</text>
    <text x="882" y="478" text-anchor="middle" class="small">多条候选序列</text>
    <text x="797" y="531" class="small">决定：</text>
    <text x="797" y="554" class="small">“这个形状由哪些氨基酸组成？”</text>

    <!-- Arrow 3 -->
    <path d="M995 384 L1020 384" stroke="#456257" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Card 4 AF2 -->
    <g filter="url(#shadow)">
      <rect x="1030" y="178" width="260" height="412" rx="18" fill="#FFFFFF"/>
    </g>
    <circle cx="1068" cy="218" r="18" fill="#FFF1D5"/>
    <path d="M1058 218 l7 7 l14 -16" fill="none" stroke="#B77A00" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1097" y="225" class="cardTitle">AlphaFold2 筛选</text>

    <rect x="1052" y="270" width="216" height="102" rx="13" fill="#F1F6F3" stroke="#B9CBC2"/>
    <text x="1070" y="298" class="body bold">① 单体回折</text>
    <text x="1070" y="324" class="small">binder 单独输入 AF2</text>
    <text x="1070" y="348" class="small">能否稳定回到设计骨架？</text>

    <rect x="1052" y="391" width="216" height="114" rx="13" fill="#EEF5FA" stroke="#AACADF"/>
    <text x="1070" y="419" class="body bold">② 复合物 initial guess</text>
    <text x="1070" y="445" class="small">以设计复合物作初始坐标</text>
    <text x="1070" y="469" class="small">界面是否保持、链间是否可信？</text>
    <text x="1070" y="491" class="micro">pLDDT · pAE interaction · RMSD</text>

    <text x="1052" y="545" class="small bold">+ Rosetta / 界面物理指标</text>
    <text x="1052" y="567" class="micro">氢键、接触、疏水暴露、界面能量</text>

    <!-- Arrow 4 -->
    <path d="M1295 384 L1320 384" stroke="#456257" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Card 5 Validation -->
    <g filter="url(#shadow)">
      <rect x="1330" y="178" width="210" height="412" rx="18" fill="#FFFFFF"/>
    </g>
    <circle cx="1367" cy="218" r="18" fill="#FBE7E4"/>
    <path d="M1357 209 h20 M1363 209 v12 c0 4 -7 9 -7 15 c0 8 22 8 22 0 c0 -6 -7 -11 -7 -15 v-12" fill="none" stroke="#C34B3F" stroke-width="2.5" stroke-linecap="round"/>
    <text x="1396" y="225" class="cardTitle">实验验证</text>

    <rect x="1352" y="270" width="166" height="55" rx="11" fill="#F7F2F1" stroke="#DFC1BC"/>
    <text x="1435" y="304" text-anchor="middle" class="body">表达与可溶性</text>
    <rect x="1352" y="340" width="166" height="72" rx="11" fill="#F7F2F1" stroke="#DFC1BC"/>
    <text x="1435" y="369" text-anchor="middle" class="body">BLI 亲和力</text>
    <text x="1435" y="393" text-anchor="middle" class="small">+ 特异性</text>
    <rect x="1352" y="427" width="166" height="72" rx="11" fill="#F7F2F1" stroke="#DFC1BC"/>
    <text x="1435" y="456" text-anchor="middle" class="body">热稳定性</text>
    <text x="1435" y="480" text-anchor="middle" class="small">CD / melting</text>
    <rect x="1352" y="514" width="166" height="55" rx="11" fill="#F7F2F1" stroke="#DFC1BC"/>
    <text x="1435" y="548" text-anchor="middle" class="body">结构 / 功能验证</text>

    <!-- refinement loop -->
    <rect x="335" y="645" width="955" height="112" rx="18" fill="#FFFFFF" stroke="#9FC9B1" stroke-width="2"/>
    <rect x="355" y="663" width="150" height="30" rx="15" fill="#007A3D"/>
    <text x="430" y="684" text-anchor="middle" font-size="14" font-weight="700" class="white">命中后的优化回路</text>
    <text x="367" y="724" class="body bold">初始命中复合物</text>
    <path d="M510 718 L585 718" stroke="#007A3D" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <rect x="600" y="684" width="300" height="68" rx="14" fill="#EAF6EF" stroke="#76B994"/>
    <text x="750" y="711" text-anchor="middle" class="body bold">Two-sided partial diffusion</text>
    <text x="750" y="736" text-anchor="middle" class="small">target 与 binder 同时部分加噪、共同去噪</text>
    <path d="M905 718 L975 718" stroke="#007A3D" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <text x="995" y="710" class="body bold">局部新骨架</text>
    <text x="995" y="735" class="small">再走 ProteinMPNN + AF2 筛选</text>
    <path d="M1165 683 C1165 628 1120 623 1120 600" fill="none" stroke="#007A3D" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowGreen)"/>

    <!-- output boundary -->
    <rect x="60" y="796" width="1480" height="70" rx="16" fill="#FFF8E9" stroke="#D5A43C" stroke-width="1.8"/>
    <circle cx="94" cy="831" r="18" fill="#F4B43C"/>
    <text x="94" y="838" text-anchor="middle" font-size="20" font-weight="700" fill="#49350E">!</text>
    <text x="125" y="824" font-size="17" font-weight="700" fill="#5A4315">输出边界：</text>
    <text x="227" y="824" font-size="17" fill="#5A4315">模型提出的是“一个兼容的结合态构象 + 一个稳定 binder”，不是 IDR 自由态的完整 ensemble，也不给构象热力学概率。</text>
    <text x="125" y="849" class="small">本图展开论文的设计流程；RFdiffusion 内部的 RoseTTAFold 去噪网络为复用基础模型，不是本文重新发明的一套底层网络。</text>
  </g>
</svg>
