<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650">
  <defs>
    <style>
      .font { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; }
      .lane-title { font-size: 26px; font-weight: 700; fill: #064B32; }
      .lane-sub { font-size: 15px; font-weight: 500; fill: #61736A; letter-spacing: .2px; }
      .box-title { font-size: 23px; font-weight: 700; fill: #123E2D; }
      .box-title-small { font-size: 20px; font-weight: 700; fill: #123E2D; }
      .box-sub { font-size: 15px; font-weight: 500; fill: #61736A; }
      .method { font-size: 21px; font-weight: 700; fill: #FFFFFF; }
      .method-sub { font-size: 14px; font-weight: 500; fill: #DDF3E8; }
      .question { font-size: 20px; font-weight: 700; fill: #9A4D13; }
      .note { font-size: 17px; font-weight: 600; fill: #7A4A1E; }
      .legend { font-size: 15px; font-weight: 600; fill: #50645B; }
    </style>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#17895C"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E58A38"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="650" fill="#FFFFFF"/>

  <!-- Legend -->
  <g class="font">
    <line x1="1080" y1="33" x2="1134" y2="33" stroke="#17895C" stroke-width="4" marker-end="url(#arrow-green)"/>
    <text x="1148" y="39" class="legend">论文已实现</text>
    <line x1="1290" y1="33" x2="1344" y2="33" stroke="#E58A38" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arrow-orange)"/>
    <text x="1358" y="39" class="legend">待验证连接</text>
  </g>

  <!-- Lane backgrounds -->
  <rect x="28" y="60" width="1544" height="148" rx="22" fill="#F2F8F5" stroke="#D6E9DF"/>
  <rect x="28" y="232" width="1544" height="148" rx="22" fill="#F7FAF8" stroke="#DFECE5"/>
  <rect x="28" y="404" width="1544" height="148" rx="22" fill="#F2F8F5" stroke="#D6E9DF"/>

  <!-- Lane A label -->
  <g class="font">
    <rect x="48" y="84" width="9" height="100" rx="4.5" fill="#087A4B"/>
    <text x="78" y="121" class="lane-title">A  构象预测</text>
    <text x="78" y="151" class="lane-sub">sequence → ensemble</text>
  </g>

  <!-- Lane A boxes -->
  <g class="font">
    <rect x="282" y="94" width="184" height="80" rx="17" fill="#FFFFFF" stroke="#8CB9A3" stroke-width="2"/>
    <text x="374" y="128" text-anchor="middle" class="box-title">IDR sequence</text>
    <text x="374" y="153" text-anchor="middle" class="box-sub">自然氨基酸序列</text>

    <rect x="528" y="88" width="242" height="92" rx="19" fill="#087A4B"/>
    <text x="649" y="127" text-anchor="middle" class="method">STARLING / IDPFold</text>
    <text x="649" y="154" text-anchor="middle" class="method-sub">从序列采样构象</text>

    <rect x="836" y="94" width="208" height="80" rx="17" fill="#FFFFFF" stroke="#8CB9A3" stroke-width="2"/>
    <text x="940" y="128" text-anchor="middle" class="box-title">Model ensemble</text>
    <text x="940" y="153" text-anchor="middle" class="box-sub">多个构象及其分布</text>

    <rect x="1110" y="88" width="314" height="92" rx="19" fill="#E5F3EC" stroke="#69A98A" stroke-width="2"/>
    <text x="1267" y="124" text-anchor="middle" class="box-title">Forward model + 公开实验</text>
    <text x="1267" y="151" text-anchor="middle" class="box-sub">将构象转为 SAXS / FRET / NMR 信号</text>

    <line x1="466" y1="134" x2="516" y2="134" stroke="#17895C" stroke-width="4" marker-end="url(#arrow-green)"/>
    <line x1="770" y1="134" x2="824" y2="134" stroke="#17895C" stroke-width="4" marker-end="url(#arrow-green)"/>
    <line x1="1044" y1="134" x2="1098" y2="134" stroke="#17895C" stroke-width="4" marker-end="url(#arrow-green)"/>
  </g>

  <!-- Lane B label -->
  <g class="font">
    <rect x="48" y="256" width="9" height="100" rx="4.5" fill="#087A4B"/>
    <text x="78" y="293" class="lane-title">B  功能预测</text>
    <text x="78" y="323" class="lane-sub">sequence + environment → function</text>
  </g>

  <!-- Lane B boxes -->
  <g class="font">
    <rect x="320" y="266" width="250" height="80" rx="17" fill="#FFFFFF" stroke="#8CB9A3" stroke-width="2"/>
    <text x="445" y="299" text-anchor="middle" class="box-title-small">Sequence + Environment</text>
    <text x="445" y="324" text-anchor="middle" class="box-sub">序列、温度、pH、离子强度等</text>

    <rect x="626" y="260" width="194" height="92" rx="19" fill="#087A4B"/>
    <text x="723" y="300" text-anchor="middle" class="method">LLPSense</text>
    <text x="723" y="327" text-anchor="middle" class="method-sub">不以生成ensemble为输入</text>

    <rect x="876" y="266" width="234" height="80" rx="17" fill="#FFFFFF" stroke="#8CB9A3" stroke-width="2"/>
    <text x="993" y="299" text-anchor="middle" class="box-title">LLPS / 功能行为</text>
    <text x="993" y="324" text-anchor="middle" class="box-sub">相分离倾向与条件依赖性</text>

    <line x1="570" y1="306" x2="614" y2="306" stroke="#17895C" stroke-width="4" marker-end="url(#arrow-green)"/>
    <line x1="820" y1="306" x2="864" y2="306" stroke="#17895C" stroke-width="4" marker-end="url(#arrow-green)"/>
  </g>

  <!-- Research question connector -->
  <g class="font">
    <path d="M 940 174 C 940 202, 988 220, 988 256" fill="none" stroke="#E58A38" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow-orange)"/>
    <rect x="1128" y="252" width="402" height="108" rx="18" fill="#FFF5E9" stroke="#E58A38" stroke-width="2" stroke-dasharray="9 7"/>
    <text x="1329" y="285" text-anchor="middle" class="question">本研究问题</text>
    <text x="1329" y="316" text-anchor="middle" class="note">ensemble 是否在 sequence + environment 之外</text>
    <text x="1329" y="342" text-anchor="middle" class="note">提供稳定、可泛化的额外信息？</text>
  </g>

  <!-- Lane C label -->
  <g class="font">
    <rect x="48" y="428" width="9" height="100" rx="4.5" fill="#087A4B"/>
    <text x="78" y="465" class="lane-title">C  分子设计</text>
    <text x="78" y="495" class="lane-sub">goal / target → design</text>
  </g>

  <!-- Lane C boxes -->
  <g class="font">
    <rect x="320" y="438" width="250" height="80" rx="17" fill="#FFFFFF" stroke="#8CB9A3" stroke-width="2"/>
    <text x="445" y="471" text-anchor="middle" class="box-title">Design goal / Target</text>
    <text x="445" y="496" text-anchor="middle" class="box-sub">目标性质或无序靶标序列</text>

    <rect x="626" y="426" width="414" height="104" rx="19" fill="#087A4B"/>
    <text x="833" y="466" text-anchor="middle" class="method" style="font-size:20px">GOOSE · IDR binder · Interface peptide</text>
    <text x="833" y="495" text-anchor="middle" class="method-sub">序列反向设计 / 结合态设计 / 工程应用</text>

    <rect x="1100" y="438" width="300" height="80" rx="17" fill="#FFFFFF" stroke="#8CB9A3" stroke-width="2"/>
    <text x="1250" y="471" text-anchor="middle" class="box-title">Designed molecule</text>
    <text x="1250" y="496" text-anchor="middle" class="box-sub">新IDR序列 / binder / 功能肽</text>

    <line x1="570" y1="478" x2="614" y2="478" stroke="#17895C" stroke-width="4" marker-end="url(#arrow-green)"/>
    <line x1="1040" y1="478" x2="1088" y2="478" stroke="#17895C" stroke-width="4" marker-end="url(#arrow-green)"/>
  </g>

  <!-- Long-term direction -->
  <g class="font">
    <rect x="1012" y="576" width="518" height="44" rx="22" fill="#FFF5E9" stroke="#F0BD88"/>
    <text x="1271" y="604" text-anchor="middle" class="note">长期：若ensemble有增益，再用于binder排序与多构象设计</text>
  </g>
</svg>
