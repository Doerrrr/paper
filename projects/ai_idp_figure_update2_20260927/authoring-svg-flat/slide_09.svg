<text x="696" y="430.39" text-anchor="start" xml:space="preserve" font-size="18" fill="#153A2A"><tspan>STARLING 强调快速采样与距离表示；IDPFold 强调残基刚体、主</tspan><tspan x="696" dy="23.4">链几何与扩散生成。</tspan></text>
