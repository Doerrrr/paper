<text x="696" y="138.97" text-anchor="start" xml:space="preserve" font-size="16.67" fill="#007A3D" font-weight="bold" data-pptx-text-model="paragraphs" data-paragraph-line-height="24.8"><tspan><tspan>论文能够支持的判断</tspan></tspan><tspan font-size="18" fill="#153A2A"><tspan>输入：序列特征 + 原文定义的环境变量。</tspan></tspan><tspan font-size="18" fill="#153A2A" data-paragraph-space-before="1.26"><tspan>输出：分类、分数或相边界。</tspan></tspan><tspan font-size="18" fill="#153A2A" data-paragraph-space-before="1.27"><tspan>重点：环境条件是否改善独立测试表现。</tspan></tspan><tspan font-size="18" fill="#153A2A" data-paragraph-space-before="1.27"><tspan>意义：功能行为不能只看序列本身。</tspan></tspan></text>
</g>
