<text x="696" y="401.5" text-anchor="start" xml:space="preserve" font-size="18" fill="#153A2A"><tspan>没有显式使用 ensemble，就不能说明“构象分布 → 多价相互作用 </tspan><tspan x="696" dy="23.4">→ LLPS”这一机制成立。</tspan></text>
