<g id="shape-32" data-pptx-object="shape" data-pptx-frame="696 137.38 520.32 101.87" data-pptx-prst="rect" data-pptx-source-ref="slide:32">

<path d="M 696 137.38 L 1216.32 137.38 L 1216.32 239.24 L 696 239.24 Z" fill="none" />


<text x="696" y="151.54" text-anchor="start" xml:space="preserve" font-size="16.67" fill="#007A3D" font-weight="bold">主要创新点：</text>
<text x="696" y="176.91" text-anchor="start" xml:space="preserve" font-size="18.67" fill="#153A2A"><tspan>以往很多方法只能预测 回转半径、端到端距离等统计性质，或</tspan><tspan x="696" dy="20.53">者生成较粗粒度的构象。</tspan><tspan>IDPFold</tspan><tspan>直接从单条氨基酸序列出发，</tspan><tspan x="696" dy="20.53">生成残基主链级三维构象</tspan></text>
</g>
<g id="shape-33" data-pptx-object="shape" data-pptx-frame="696 281.78 520.32 117.06" data-pptx-prst="rect" data-pptx-source-ref="slide:33">

<path d="M 696 281.78 L 1216.32 281.78 L 1216.32 398.84 L 696 398.84 Z" fill="none" />


<text x="696" y="295.94" text-anchor="start" xml:space="preserve" font-size="16.67" fill="#007A3D" font-weight="bold">与 STARLING 的区别</text>
<text x="696" y="321.31" text-anchor="start" xml:space="preserve" font-size="18.67" fill="#000000"><tspan>IDPFold</tspan><tspan>和</tspan><tspan>STARLING</tspan><tspan>都属于“</tspan><tspan>sequence → ensemble”</tspan><tspan>生成模型，</tspan><tspan x="696" dy="22.4">但二者解决问题的侧重点不同：</tspan></text>
<text x="696" y="366.11" text-anchor="start" xml:space="preserve" font-size="18.67" fill="#000000"><tspan>IDPFold</tspan><tspan>强调主链级三维结构与局部几何；</tspan><tspan>STARLING</tspan><tspan>强调粗粒化</tspan><tspan x="696" dy="22.4">ensemble</tspan><tspan>的速度、分布覆盖和大规模应用。</tspan></text>
</g>
<g id="shape-34" data-pptx-object="shape" data-pptx-frame="696 451.42 520.32 162.02" data-pptx-prst="rect" data-pptx-source-ref="slide:34" data-pptx-semantic-object="shape">
<path d="M 696 451.42 L 1216.32 451.42 L 1216.32 613.44 L 696 613.44 Z" fill="none" data-pptx-part="geometry" />


<text x="696" y="465.59" text-anchor="start" xml:space="preserve" font-size="16.67" fill="#007A3D" font-weight="bold" data-pptx-text-model="paragraphs" data-paragraph-line-height="24.8"><tspan><tspan>共同局限</tspan></tspan><tspan font-size="18" fill="#153A2A"><tspan>1</tspan><tspan>）生成的都是模拟的</tspan><tspan>ensemble</tspan><tspan>不是真实的</tspan></tspan><tspan font-size="18" fill="#153A2A" data-paragraph-space-before="1.27"><tspan>2</tspan><tspan>）</tspan><tspan fill="#000000" font-size="18.67">生成的是平衡构象样本，不是动态轨迹</tspan></tspan><tspan font-size="18.67" fill="#153A2A" data-paragraph-space-before="2.7"><tspan>3</tspan><tspan>）</tspan><tspan fill="#000000">都不是完整的全原子模型</tspan></tspan><tspan font-size="18.67" fill="#153A2A" data-paragraph-space-before="2.13"><tspan>4</tspan><tspan>）</tspan><tspan>环境条件描述仍然有限</tspan></tspan></text>
</g></svg>
