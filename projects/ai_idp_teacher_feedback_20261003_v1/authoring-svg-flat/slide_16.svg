</g>
<g id="shape-10" data-pptx-object="shape" data-pptx-frame="100.8 269.84 538.56 64.4" data-pptx-prst="rect" data-pptx-source-ref="slide:10">

<path d="M 100.8 269.84 L 639.36 269.84 L 639.36 334.24 L 100.8 334.24 Z" fill="none" />


<text x="100.8" y="284.57" text-anchor="start" xml:space="preserve" font-size="17.33" fill="#153A2A" font-weight="bold">2. 方法层面</text>
<text x="100.8" y="305.74" text-anchor="start" xml:space="preserve" font-size="16.67" fill="#5C6E63"><tspan>GOOSE、STARLING、IDPFold 已能生成序列与构象；但“生成得像”不等于</tspan><tspan x="100.8" dy="21.33">权重与动力学正确。</tspan></text>
</g>
<g id="shape-11" data-pptx-object="shape" data-pptx-frame="85.44 359.2 4.8 56.72" data-pptx-prst="rect" data-pptx-source-ref="slide:11" data-pptx-semantic-object="shape">
<path d="M 85.44 359.2 L 90.24 359.2 L 90.24 415.92 L 85.44 415.92 Z" fill="#007A3D" stroke="none" stroke-width="1" data-pptx-part="geometry" />


</g>
