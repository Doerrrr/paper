<text x="100.8" y="370.09" text-anchor="start" xml:space="preserve" font-size="17.33" fill="#153A2A" font-weight="bold">3. 评价层面</text>
<text x="100.8" y="391.26" text-anchor="start" xml:space="preserve" font-size="16.67" fill="#5C6E63"><tspan>只有在统一靶标、条件与观测下的盲测，配合分布级指标，才能比较不同</tspan><tspan x="100.8" dy="21.33">方法。</tspan></text>
</g>
