<text x="100.8" y="199.05" text-anchor="start" xml:space="preserve" font-size="17.33" fill="#153A2A" font-weight="bold">1. 概念层面</text>
<text x="100.8" y="220.22" text-anchor="start" xml:space="preserve" font-size="16.67" fill="#5C6E63"><tspan>IDP / IDR 的“无序”指没有单一主导结构；描述它们必须用带统计权重的 </tspan><tspan x="100.8" dy="21.33">ensemble，而不是一条结构。</tspan></text>
</g>
<g id="shape-9" data-pptx-object="shape" data-pptx-frame="85.44 273.68 4.8 56.72" data-pptx-prst="rect" data-pptx-source-ref="slide:9" data-pptx-semantic-object="shape">
